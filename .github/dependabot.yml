version: 2

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"

updates:
  - package-ecosystem: npm
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    # Security updates cannot join the cross-ecosystem version update group.
    groups:
      all-security-updates:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    groups:
      all-security-updates:
        applies-to: security-updates
        patterns: ["*"]
